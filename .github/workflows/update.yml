name: Update README

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Run update script
        run: python update.py

      - name: Remove existing snake animation
        run: rm -f assets/snk.svg assets/snk-dark.svg

      - name: Generate new snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snk.svg
            assets/snk-dark.svg?palette=github-dark

      - name: Commit and push changes
        run: |
          git config --global user.name 'Mew'
          git config --global user.email '${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com'
          git add .
          git commit -m "chore(readme): update README.md"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
